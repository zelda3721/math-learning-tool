<article data-explain="1">
<style>
 .mt{font-family:-apple-system,"PingFang SC",sans-serif;color:#16203a;background:#f6f7fa;padding:18px 20px;border-radius:12px}
 .mt h2{font-size:15px;margin:0 0 10px;font-weight:700}
 .mt section{display:none}.mt section[data-active]{display:block}
 .row{display:flex;flex-wrap:wrap;gap:9px 5px;margin:8px 0}
 .an{width:23px}
 .an .h{width:20px;height:20px;border-radius:50%;margin:0 auto;background:#2b5ce6;transition:background .25s,border-radius .25s}
 .an .l{display:flex;justify-content:center;gap:3px;height:12px}
 .an .l i{width:2px;background:#2b5ce6;border-radius:1px;transition:background .25s}
 .an .l i:nth-child(n+3){display:none}
 .an[data-swapped] .h{background:#8a6a20;border-radius:5px}
 .an[data-swapped] .l i{background:#8a6a20;display:block}
 .an[data-i]:nth-child(5n){margin-right:11px}
 .ctl{display:flex;align-items:center;gap:10px;margin:12px 0 4px;flex-wrap:wrap}
 .ctl input{flex:1;min-width:140px;max-width:280px;accent-color:#2b5ce6}
 .read{font-family:ui-monospace,monospace;font-size:13px;color:#16203a}
 .read b{font-size:15px}
 .read .fix{color:#4a5670}
 .lbl{font-size:12px;color:#4a5670;display:flex;justify-content:space-between;margin-top:9px}
 .bar{position:relative;height:22px;border:1px solid #dde2ec;border-radius:6px;background:#fff;margin-top:4px}
 .bar>b{position:absolute;top:0;bottom:0;left:0;border-radius:6px;background:rgba(43,92,230,.2);border:1px solid #2b5ce6;transition:width .25s}
 .t{font-size:13px;line-height:1.6;margin:10px 0 0}
 .nav{display:flex;gap:8px;margin-top:12px}
 .nav button{font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid #dde2ec;background:#fff;color:#4a5670;cursor:pointer}
 .nav button[aria-current=true]{background:#2b5ce6;border-color:#2b5ce6;color:#fff;font-weight:600}
 @media (prefers-reduced-motion:reduce){.mt *{transition:none!important}}
</style>
<div class="mt"><h2>鸡兔同笼：35 个头，94 只脚</h2>

<section data-beat="0" data-teach="先假设 35 只全是鸡：每只 2 只脚，一共只有 70 只脚。" data-active>
 <div class="row" data-claim="heads=35"><div class="an" data-unit="chicken" data-repeat="35"><div class="h"></div><div class="l"><i></i><i></i><i></i><i></i></div></div></div>
 <div class="lbl"><span>假设全是鸡</span><span data-measure="assumed_feet=70">70 只脚</span></div>
 <div class="bar"><b style="width:74.5%"></b></div>
 <p class="t">每个圆圈是一只动物，下面垂的短线就是它的脚。35 × 2 = 70，比实际的 94 少。</p>
</section>

<section data-beat="1" data-teach="自己拨拨看：每把一只鸡换成兔，脚就多 2 只，头一个也不多。">
 <div class="row" id="swaprow" data-claim="heads=35"><div class="an" data-unit="chicken" data-repeat="35"><div class="h"></div><div class="l"><i></i><i></i><i></i><i></i></div></div></div>
 <div class="ctl">
   <label for="k" style="font-size:12px;color:#4a5670">换成兔</label>
   <input id="k" type="range" data-control="换几只" min="0" max="35" value="0">
   <span class="read"><span class="fix">头</span> <b id="heads">35</b> <span class="fix">（一直不变）</span>　<span class="fix">脚</span> <b id="feet">70</b></span>
 </div>
 <div class="bar"><b id="feetbar" style="width:74.5%"></b></div>
 <p class="t" data-measure="gap_feet=24">缺口是 94 − 70 = 24 只脚，每换一只补 2 只，所以要换 12 只。拨到 12 试试。</p>
</section>

<section data-beat="2" data-teach="12 只兔、23 只鸡：头 35，脚 12×4 + 23×2 = 94。">
 <div class="row" data-claim="rabbits=12"><div class="an" data-swapped data-unit="rabbit" data-repeat="12"><div class="h"></div><div class="l"><i></i><i></i><i></i><i></i></div></div></div>
 <div class="row" data-claim="chickens=23"><div class="an" data-unit="chicken" data-repeat="23"><div class="h"></div><div class="l"><i></i><i></i><i></i><i></i></div></div></div>
 <p class="t">兔 12 只、鸡 23 只，头正好 35 个，脚正好 94 只。</p>
</section>

<nav class="nav"><button type="button" aria-current="true">1 假设</button><button type="button" aria-current="false">2 自己拨</button><button type="button" aria-current="false">3 核对</button></nav></div>

<script>(function(){
 var r=document.currentScript.closest('article');
 var s=r.querySelectorAll('section[data-beat]'), b=r.querySelectorAll('.nav button');
 function go(n){for(var i=0;i<s.length;i++){i===n?s[i].setAttribute('data-active',''):s[i].removeAttribute('data-active');b[i].setAttribute('aria-current',String(i===n));}}
 for(var i=0;i<b.length;i++)(function(n){b[n].addEventListener('click',function(){go(n)})})(i);
 var k=r.querySelector('#k'), row=r.querySelector('#swaprow');
 function apply(){
   var n=Number(k.value), all=row.querySelectorAll('.an');
   for(var i=0;i<all.length;i++){ i<n ? all[i].setAttribute('data-swapped','') : all[i].removeAttribute('data-swapped'); }
   var feet=(all.length-n)*2+n*4;
   r.querySelector('#feet').textContent=String(feet);
   r.querySelector('#feetbar').style.width=Math.min(100,feet/94*100)+'%';
 }
 if(k&&row){ k.addEventListener('input',apply); apply(); }
})();</script>
</article>
