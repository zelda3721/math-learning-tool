[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "math-tutor"
version = "2.0.0"
description = "AI-powered math tutoring tool with multi-grade support"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "openai>=1.10.0",
    "manim>=0.18.0",
    "sympy>=1.13.0,<2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# 本地语音（PLAN 阶段 5）：ASR 用 faster-whisper（首次用到时从 HF 拉模型，tiny.en 约 75MB）。
# 单独做成 extra 而不是必装：ctranslate2 + onnxruntime 加起来一百多 MB，
# 不用口语的人不该为它付出安装时间。
speech = [
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/math_tutor"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
